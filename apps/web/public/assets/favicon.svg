<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Starsight</title>
  <!--
    The favicon is the mark REDUCED, not the mark shrunk. At 16px the light cone
    (26% opacity) is a smudge and the ground rail is a sub-pixel line the browser
    aliases inconsistently, so both are dropped and the star is scaled to fill the
    canvas. It carries the accent rather than the cream, because a tab strip may be
    light or dark and the accent is the only tone legible on both.
  -->
  <path fill="#F5400E" d="M256 80 Q 285 220 390 256 Q 285 292 256 432 Q 227 292 122 256 Q 227 220 256 80 Z"/>
</svg>
