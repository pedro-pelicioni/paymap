<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!--
    PAYMAP / favicon.svg
    The lot mark reduced to pure geometry: a graduated limb, an index arm
    swung from a visible pivot, and one fixed star held in the open sky.
    Two colours only - ink #0B0C0E, brass #FF7A18.
    Tuned for 16px: nothing thinner than 3.2px at 32, no detail below 5px.
  -->
  <rect width="32" height="32" rx="7" fill="#0B0C0E"/>
  <g stroke="#FF7A18" fill="none" stroke-width="3.6" stroke-linecap="round">
    <!-- the limb: arc struck from the pivot at (16,6.5), r=16.5 -->
    <path d="M4.96 18.76A16.5 16.5 0 0 0 27.04 18.76"/>
    <!-- the index arm, swung from the pivot down to the limb -->
    <path d="M16 6.5 23.23 21.33"/>
  </g>
  <!-- the pivot -->
  <circle cx="16" cy="6.5" r="2.8" fill="#FF7A18"/>
  <!-- the fixed star -->
  <path d="M9 7.4 12.1 10.5 9 13.6 5.9 10.5Z" fill="#FF7A18"/>
</svg>
